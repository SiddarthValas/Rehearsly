<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1f1a" />
    <script>
      try {
        var t = localStorage.getItem("rehearsly.theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
    <meta name="description" content="Rehearsly: personalized interview practice with adaptive questions, voice, and actionable feedback." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Rehearsly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
